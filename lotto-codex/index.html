<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코덱스 로또 추첨기2</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101622; color: #f4f7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 32px, 670px); margin: clamp(26px, 7vw, 76px) auto; }
  h1 { font-size: clamp(1.8rem, 6vw, 3rem); margin: 0 0 10px; letter-spacing: -.055em; }
  h2 { margin: 0; font-size: 1.18rem; }
  p { color: #bfcbe0; line-height: 1.55; }
  section { background: #192333; border: 1px solid #34445d; border-radius: 20px; padding: clamp(14px, 4vw, 28px); margin-top: 18px; }
  .controls, .result-heading { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; }
  .result-heading { justify-content: space-between; align-items: center; }
  label { display: grid; flex: 1 1 120px; gap: 7px; }
  button, select { background: #25334a; color: inherit; border: 1px solid #596d87; border-radius: 9px; padding: 10px 13px; min-height: 45px; font: inherit; }
  button { cursor: pointer; }
  button[type=submit] { background: #a9f0ba; color: #14251a; border-color: #a9f0ba; font-weight: 750; flex: 1 1 100px; }
  :focus-visible { outline: 3px solid #a9f0ba; outline-offset: 3px; }
  #games { display: grid; gap: 8px; padding: 0; list-style: none; }
  .game { display: flex; align-items: center; gap: clamp(4px, 1.5vw, 10px); background: #111a28; border-radius: 10px; padding: 10px 8px; }
  .game-label { width: 1.45rem; color: #bfcbe0; flex-shrink: 0; }
  .ball { display: grid; place-items: center; width: clamp(26px, 8vw, 44px); aspect-ratio: 1; border-radius: 50%; background: var(--ball); color: #111925; font-weight: 800; font-variant-numeric: tabular-nums; }
  #coverage { margin-bottom: 0; }
  #status { min-height: 1.6rem; margin: 8px 0 0; }
  #copyFallback { width: 100%; min-height: 8rem; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>코덱스 로또 추첨기</h1>
  <p>1부터 45까지, 게임당 6개를 추첨합니다.</p>
  <section aria-label="추첨 설정">
    <form id="drawForm" class="controls">
      <label>추첨 방식
        <select id="mode" aria-describedby="modeHelp">
          <option value="independent">독립 추첨</option>
          <option value="spread">번호 분산</option>
        </select>
      </label>
      <label>게임 수
        <select id="count">
          <option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option>
        </select>
      </label>
      <button type="submit">번호 추첨</button>
    </form>
    <p id="modeHelp"></p>
  </section>
  <section aria-labelledby="resultTitle">
    <div class="result-heading">
      <h2 id="resultTitle">추첨 결과</h2>
      <button id="copy" type="button">번호 복사</button>
    </div>
    <ul id="games" aria-label="게임별 번호"></ul>
    <p id="coverage" aria-live="polite"></p>
    <p id="status" role="status"></p>
    <textarea id="copyFallback" aria-label="직접 복사할 추첨 번호" readonly hidden></textarea>
  </section>
</main>
<script>
  function randomBelow(limit) {
    const value = new Uint32Array(1);
    const cutoff = 2 ** 32 - (2 ** 32 % limit);
    do {
      crypto.getRandomValues(value);
    } while (value[0] >= cutoff);
    return value[0] % limit;
  }

  function numberPool() {
    return Array.from({ length: 45 }, (_, index) => index + 1);
  }

  function drawGame(pool, chooseIndex) {
    return Array.from({ length: 6 }, () => {
      return pool.splice(chooseIndex(pool.length), 1)[0];
    }).sort((left, right) => left - right);
  }

  function drawGames(count, mode, chooseIndex = randomBelow) {
    const sharedPool = numberPool();
    return Array.from({ length: count }, () => {
      const pool = mode === 'spread' ? sharedPool : numberPool();
      return drawGame(pool, chooseIndex);
    });
  }

  const mode = document.getElementById('mode');
  const count = document.getElementById('count');
  const gameList = document.getElementById('games');
  const coverage = document.getElementById('coverage');
  const status = document.getElementById('status');
  const copyFallback = document.getElementById('copyFallback');
  const colors = ['#ffd475', '#8fcdff', '#ffaba7', '#d3bfec', '#a9f0ba'];
  let games = [];
  let drawCount = 0;

  function updateModeHelp() {
    document.getElementById('modeHelp').textContent = mode.value === 'spread'
      ? '여러 게임에 걸쳐 같은 번호를 한 번만 씁니다. 5게임이면 서로 다른 번호 30개를 씁니다.'
      : '게임마다 45개 번호에서 새로 뽑습니다. 게임끼리는 번호가 겹칠 수 있습니다.';
  }

  function renderDraw() {
    games = drawGames(Number(count.value), mode.value);
    drawCount += 1;
    status.textContent = '';
    copyFallback.hidden = true;
    gameList.replaceChildren();
    games.forEach((game, index) => {
      const row = document.createElement('li');
      row.className = 'game';
      const label = document.createElement('span');
      label.className = 'game-label';
      label.textContent = String.fromCharCode(65 + index);
      row.append(label);
      for (const number of game) {
        const ball = document.createElement('span');
        ball.className = 'ball';
        ball.style.setProperty('--ball', colors[Math.floor((number - 1) / 10)]);
        ball.textContent = number;
        row.append(ball);
      }
      gameList.append(row);
    });
    const unique = new Set(games.flat()).size;
    const modeLabel = mode.selectedOptions[0].textContent;
    coverage.textContent = modeLabel + ' · ' + games.length + '게임 · 서로 다른 번호 ' + unique + '개';
    if (drawCount > 1) status.textContent = '새 번호를 추첨했습니다.';
  }

  async function copyGames() {
    const copiedDraw = drawCount;
    const text = games.map((game, index) =>
      String.fromCharCode(65 + index) + '. ' + game.join(', ')
    ).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      if (copiedDraw !== drawCount) return;
      copyFallback.hidden = true;
      status.textContent = '번호를 복사했습니다.';
    } catch {
      if (copiedDraw !== drawCount) return;
      copyFallback.value = text;
      copyFallback.hidden = false;
      copyFallback.focus();
      copyFallback.select();
      status.textContent = '선택된 번호를 직접 복사할 수 있습니다.';
    }
  }

  mode.addEventListener('change', updateModeHelp);
  document.getElementById('drawForm').addEventListener('submit', event => {
    event.preventDefault();
    renderDraw();
  });
  document.getElementById('copy').addEventListener('click', copyGames);
  updateModeHelp();
  renderDraw();
</script>
</body>
</html>
